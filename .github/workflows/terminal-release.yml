name: Terminal release

# Builds the Linux till (AppImage + .deb). A tag terminal-vX.Y.Z builds that
# version and uploads it to the updates folder on our server, where tills
# update from; a manual run only builds, to try it on a test PC first.

on:
  push:
    tags: ['terminal-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-release
  cancel-in-progress: false

jobs:
  linux:
    name: Linux till
    # The oldest supported runner: an AppImage runs on this glibc and newer (Ubuntu 24.04 pilot).
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/terminal-v') }}
      DIST: apps/pos-terminal/vendor/nativephp/desktop/resources/electron/dist

    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        run: |
          if [ "$PUBLISH" = "true" ]; then
            version="${GITHUB_REF_NAME#terminal-v}"
          else
            version="0.0.0-test.${GITHUB_RUN_NUMBER}"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag must look like terminal-v1.2.3"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the release settings
        if: env.PUBLISH == 'true'
        env:
          HAS_KEY: ${{ secrets.UPDATES_SSH_KEY != '' && secrets.UPDATES_SSH_KNOWN_HOSTS != '' }}
          SSH_HOST: ${{ vars.UPDATES_SSH_HOST }}
          SSH_USER: ${{ vars.UPDATES_SSH_USER }}
          UPDATES_URL: ${{ vars.VENDAPOS_UPDATES_URL }}
          API_URL: ${{ vars.VENDAPOS_API_URL }}
        run: |
          missing=""
          [ "$HAS_KEY" = "true" ] || missing="$missing UPDATES_SSH_KEY/UPDATES_SSH_KNOWN_HOSTS (secrets)"
          for name in SSH_HOST SSH_USER UPDATES_URL API_URL; do
            [ -n "${!name}" ] || missing="$missing $name (variable)"
          done
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, gd, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/pos-terminal/package-lock.json

      - name: Install Composer dependencies
        working-directory: apps/pos-terminal
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Build front-end assets
        working-directory: apps/pos-terminal
        run: |
          npm ci
          npm run build

      # The .env that ships inside the app. It holds no secret.
      - name: Write the till's .env
        working-directory: apps/pos-terminal
        env:
          VERSION: ${{ steps.version.outputs.version }}
          API_URL: ${{ vars.VENDAPOS_API_URL }}
          UPDATES_URL: ${{ vars.VENDAPOS_UPDATES_URL }}
        run: |
          cp .env.example .env
          set_env() {
            if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env; else echo "$1=$2" >> .env; fi
          }
          set_env APP_NAME VendaPOS
          set_env APP_ENV production
          set_env APP_DEBUG false
          set_env LOG_LEVEL warning
          set_env NATIVEPHP_APP_VERSION "$VERSION"
          set_env VENDAPOS_API_URL "$API_URL"
          set_env VENDAPOS_UPDATES_URL "$UPDATES_URL"
          set_env NATIVEPHP_UPDATER_ENABLED "$PUBLISH"
          php artisan key:generate --force

      - name: Build
        working-directory: apps/pos-terminal
        env:
          NATIVEPHP_APP_VERSION: ${{ steps.version.outputs.version }}
          NATIVEPHP_UPDATER_ENABLED: ${{ env.PUBLISH }}
          VENDAPOS_UPDATES_URL: ${{ vars.VENDAPOS_UPDATES_URL }}
        run: php artisan native:build linux x64 --no-interaction

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: vendapos-terminal-${{ steps.version.outputs.version }}-linux
          path: |
            ${{ env.DIST }}/*.AppImage
            ${{ env.DIST }}/*.deb
            ${{ env.DIST }}/latest-linux.yml
          if-no-files-found: error
          retention-days: 30

      # The server's key only lets this user write into the updates folder (rrsync).
      - name: Upload to the updates folder
        if: env.PUBLISH == 'true'
        env:
          SSH_KEY: ${{ secrets.UPDATES_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.UPDATES_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.UPDATES_SSH_HOST }}
          SSH_USER: ${{ vars.UPDATES_SSH_USER }}
          SSH_PORT: ${{ vars.UPDATES_SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/updates && chmod 600 ~/.ssh/updates
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_cmd="ssh -i $HOME/.ssh/updates -p $SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # The AppImage first, the file that announces it last: a till never sees a version that is not there yet.
          rsync -e "$ssh_cmd" --chmod=F644 "$DIST"/*.AppImage "$SSH_USER@$SSH_HOST:"
          rsync -e "$ssh_cmd" --chmod=F644 "$DIST"/latest-linux.yml "$SSH_USER@$SSH_HOST:"
          rm -f ~/.ssh/updates
