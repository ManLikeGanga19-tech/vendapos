name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  platform:
    name: Platform (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4']

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: vendapos
          POSTGRES_PASSWORD: vendapos
          POSTGRES_DB: vendapos
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vendapos"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, pdo_sqlite, pcntl, zip, gd, opcache
          coverage: none

      - name: Install Composer dependencies
        working-directory: apps/platform
        run: composer install --no-interaction --prefer-dist

      - name: Copy env
        working-directory: apps/platform
        run: cp .env.example .env && php artisan key:generate

      - name: Pint (formatting)
        working-directory: apps/platform
        run: ./vendor/bin/pint --test

      - name: Larastan (static analysis)
        working-directory: apps/platform
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Pest (tests)
        working-directory: apps/platform
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: vendapos
          DB_USERNAME: vendapos
          DB_PASSWORD: vendapos
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: redis
        run: ./vendor/bin/pest

  core:
    name: Core Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath
          coverage: none

      - name: Install Composer dependencies
        working-directory: packages/core
        run: composer install --no-interaction --prefer-dist

      - name: Pest (tests)
        working-directory: packages/core
        run: ./vendor/bin/pest

  terminal:
    name: POS Terminal
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        working-directory: apps/pos-terminal
        run: composer install --no-interaction --prefer-dist

      - name: Tests
        working-directory: apps/pos-terminal
        run: php artisan test
